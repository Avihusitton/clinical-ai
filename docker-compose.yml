version: '3.8'

services:
  app:
    build: .
    ports:
      - "8765:8765"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=change-me
    env_file:
      - .env

  neo4j:
    image: neo4j:5.19.0
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/change-me
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
